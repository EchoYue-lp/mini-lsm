syntax = "proto3";

package lsm;

// LSM操作请求
message LsmRequest {
  oneof request {
    // 基础操作
    GetRequest get = 1;
    PutRequest put = 2;
    DeleteRequest delete = 3;
    ScanRequest scan = 4;

    // 事务操作
    BeginTxnRequest begin_txn = 5;
    CommitTxnRequest commit_txn = 6;
    TxnGetRequest txn_get = 7;
    TxnPutRequest txn_put = 8;
    TxnDeleteRequest txn_delete = 9;
  }
}

// LSM操作响应
message LsmResponse {
  oneof response {
    // 基础操作响应
    GetResponse get_result = 1;
    PutResponse put_result = 2;
    DeleteResponse delete_result = 3;
    ScanResponse scan_result = 4;

    // 事务操作响应
    BeginTxnResponse txn_started = 5;
    CommitTxnResponse txn_committed = 6;
    TxnGetResponse txn_get_result = 7;
    TxnPutResponse txn_put_result = 8;
    TxnDeleteResponse txn_delete_result = 9;

    // 错误响应
    ErrorResponse error = 99;
  }
}

// 基础操作消息类型

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  optional bytes value = 1;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  // Put操作成功则响应为空
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  // Delete操作成功则响应为空
}

message ScanRequest {
  optional bytes start = 1;  // 可选，为空表示从头开始
  optional bytes end = 2;    // 可选，为空表示到结尾
  optional uint32 limit = 3; // 可选限制条目数
}

message ScanResponse {
  repeated KeyValuePair items = 1;
}

message KeyValuePair {
  bytes key = 1;
  bytes value = 2;
}

// 事务操作消息类型

message BeginTxnRequest {
  // 开始事务，无需参数
}

message BeginTxnResponse {
  uint64 txn_id = 1;
}

message CommitTxnRequest {
  uint64 txn_id = 1;
}

message CommitTxnResponse {
  // 提交成功则响应为空
}

message TxnGetRequest {
  uint64 txn_id = 1;
  bytes key = 2;
}

message TxnGetResponse {
  optional bytes value = 1;
}

message TxnPutRequest {
  uint64 txn_id = 1;
  bytes key = 2;
  bytes value = 3;
}

message TxnPutResponse {
  // Put操作成功则响应为空
}

message TxnDeleteRequest {
  uint64 txn_id = 1;
  bytes key = 2;
}

message TxnDeleteResponse {
  // Delete操作成功则响应为空
}

// 错误响应
message ErrorResponse {
  string message = 1;
}